  date: "2026-10-02"
  note: >
    题面取官方测试 FUSED=False 的 one-kernel 反向子集：稠密定长 bshd 布局
    （非 varlen）、fp16/bf16、dropout=0、无 ALiBi/bias/fp8、MHA/GQA、
    causal 与 non-causal（右下对齐）、seqlen_q 与 seqlen_k 大小关系任意
    （含 causal 全掩码行）。o 与 lse 作为 kernel 输入给定——语义上等价于
    官方测试 flash_attn_func 前向的 saved tensors（softmax_lse 为 [batch,
    num_q_heads, seqlen_q] float32 自然对数 log-sum-exp，全掩码行 lse=0/o=0，
    与 aiter 前向约定一致），delta 由给定 o 计算，与
    flash_attn_onekernel_backward 的算子契约一致。真值依据
    test_mha.py::test_mha_backward（FUSED=False 路径，attention_ref 上
    torch.autograd.grad 对照，atol=rtol=1e-2）。留作后续题：varlen
    （test_mha_backward_varlen）、dropout、fp8、mha_fused_bwd.py 的
    fused 反向（FUSED=True，与本题平行的姊妹实现）。源码与官方测试无冲突。
