  note: >
    题面子集：2D（无 batch 维）gemm_a8w8，in_dtype 覆盖官方测试全部三种
    （fp8e4m3 / fp8e5m2 / int8），out_dtype 以 bfloat16 为主、另设 float16
    变体 case，bias 可选（float32，与官方测试生成器一致），TN 布局
    （x 行主 (M,K)、w 行主 (N,K)）。语义依据官方测试 run_torch：fp32 GEMM →
    外乘 scale → fp32 域加 bias → cast 输出 dtype；kernel 的融合顺序
    （scale 后先 cast 到 bias dtype 再相加）因 bias 恒为 float32 而与之
    等价，无冲突。官方测试的 output=True/False（y 预分配输出缓冲）不影响
    返回值语义，不作为题面变体；官方超大 shape（至 8192^3）取规模适中子集
    入 perf。batch 维变体为 4001_batched_gemm_a8w8，不与本题合并；
    128x128 分块 scale 的 int8 版（gemm_w8a8）语义不同，留作后续题。
