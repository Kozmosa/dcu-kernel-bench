admission:
  core_compute_in_source: true    # tl.dot 主计算、scale 外乘、bias 融合全部在 _batched_gemm_a8w8_kernel
  calls_closed_libs: false
  builds_standalone: true
  has_reference: true             # 官方测试 run_torch 移植进题目文件 Model（fp32 eager）
  decision: admitted
  reviewer: "批量准入工作流（构建/复核独立 agent）"
  date: "2026-10-02"
  note: >
    题面子集：TN 布局（x 行主 (B,M,K)、w 行主 (B,N,K)）的 batch 维 int8×int8
    GEMM，per-token (B,M,1) × per-channel (B,1,N) scale 外乘反量化，可选 bias
    （融合顺序：fp32 结果先 cast 到输出 dtype 再加 bias），输出 bfloat16/float16；
    码字值域与 scale/bias 量级沿用官方测试生成器（[-20,20)、rand+1e-6、rand*10）。
    语义冲突以官方测试 run_torch 为准（kernel 中 WQ.transpose(1,2) 与 run_torch
    的 F.linear 等价）；源码的 splitK 分支无 Triton 实现（断言禁用）、fp8/afp4
    变体（batched_gemm_afp4wfp4*）与非量化 batched_gemm_bf16、CK 闭源路径
    （csrc/ck_batched_gemm_a8w8）均留作后续独立题。batched_gemm_* 四项同骨架
    不同输入格式的算子各自独立出题；与单 batch 的 gemm_a8w8 仅差 batch 维，
    按不同算子保留。case 由题目文件内 make_inputs(**case) 确定性生成
    （torch.Generator(seed)，消费顺序 xq→wq→x_scale→w_scale→bias）。
    复核修复（2026-10-02，独立复核 agent 报告）：reference.py forward 改为
    全单行顶层语句——框架 loader 逐条提取顶层语句生成 ModelNew scaffold
    时统一加 8 空格缩进，多行 if/else 块会使 else 错位产生非法缩进
    （python_region_syntax_error）；task.yaml 移除 source 块与 docstring
    禁用列表中的库名，溯源信息只保留在本文件。
