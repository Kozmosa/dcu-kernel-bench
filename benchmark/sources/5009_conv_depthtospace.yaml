      role: semantic_spec   # conv+D2S 样例：conv_fprop → reshape→transpose→reshape 六维重排（DCR demo），outH/outW 公式与 CRD/DCR 排列定义的权威来源
    - path: python/conv_depthtospace_fusion/conv_bias_dts.py
