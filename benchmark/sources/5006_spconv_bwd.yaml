admission:
  core_compute_in_source: true    # 题目 reference.py 自包含纯 PyTorch（同族 spconv_fprop 前向构图 + autograd 反传），标准 ATen 组合即可
  calls_closed_libs: false        # 题目本体不调用闭源库；样例的 hipDNN 设备路径仅作语义口径与性能基线方向，不作为 core_compute 证据，生成侧 forbidden 明确禁用 hipdnn/miopen
  builds_standalone: true
  has_reference: true             # reference 以 autograd 反传同族前向为语义金标（保证 dgrad/wgrad 与 5005 前向严格一致）
  decision: admitted
  reviewer: "批量准入工作流（构建/复核独立 agent）"
  date: "2026-10-12"
  note: >
    题面子集：hipdnn_samples 的 spconv 家族 8 个样例中 spconv_dgrad 与
    spconv_wgrad 两个反向样例，以 init 超参 variant 选择——dgrad（对输入
    特征求梯度，spconv_dgrad.py 口径）与 wgrad（对权值求梯度，
    spconv_wgrad.py 口径）；igemm_dgrad / igemm_wgrad / igemm_indice_pairs
    的隐式 GEMM 形式与 indice_pairs 生成留作后续题，与本题不重叠（fprop
    归 5005_spconv_fprop）。输入输出契约逐行取自两个 Python 样例的并集：
    features (n, c_in)、filters (c_out, c_in, kv)、out_bp (num_act_out,
    c_out)、indice_pairs (2, kv, n) int32、indice_num_per_loc (kv,) int32，
    forward 五输入签名按样例相对顺序固定
    (features, filters, out_bp, indice_pairs, indice_num_per_loc)；dgrad
    只消费 filters/out_bp/两索引张量（features 数值不参与输出）、wgrad 只
    消费 features/out_bp/两索引张量（filters 数值不参与输出），样例各自的
    四输入是其子集。样例 dtype 为 FLOAT，题目以 fp32 为主 dtype，补充
    fp16/bf16 变体（fp32 累加后单次 cast 回 features dtype，容差按 dtype
    分档）。
    语义口径依据与冲突处理：(1) 两样例数据全零且不校验输出（与 5005 同——
    num_act_out=3、counts 全 0），dgrad/wgrad 的数值语义以"同族前向的精确
    伴随"唯一固定：前向即 5005 口径（gather-GEMM-scatter，W[o, i, k] =
    F.reshape(c_out, kv, c_in)[o, k, i]），reference 对该前向构图后用
    autograd 反传（dy 为样例命名 out_bp），保证两方向与前向（含布局映射）
    严格一致——这与 5002/5004 的 autograd 反传口径同构；(2) dgrad 样例
    filters 以 as_strided(shape, [c_in*kv, 1, c_in]) 传入（与 5005 相同的
    布局映射），C++ 样例 filters 用 contiguous strides (kv*cIn, kv, 1)，
    两样例冲突——按 5005 先例以 Python 样例为准，wgrad 输出 dF 按 filters
    同一布局映射解释（dF.reshape(c_out, kv, c_in)[o, k, i] = dW_math[o,
    i, k]，autograd 对布局映射的组合自然给出）， contiguous (c_out, c_in,
    kv) 存储；样例仅 set_output 不定 dw 维（"dw dims are not inferred"），
    题目据 5005 输入侧口径显式固定；(3) dgrad 输出 dx 样例未定维，C++ 样例
    明示 (n, cIn) stride (cIn, 1)，题目据此前向公式固定；indice 表"行 0 =
    输入 gather / 行 1 = 输出 scatter、j >= indice_num_per_loc[k] 为填充
    垃圾须屏蔽"沿用 spconv 生态标准约定（5005 已固定，两题一致）。
    输出契约：两方向均天然单张量输出（dgrad (n, c_in) / wgrad (c_out,
    c_in, kv)），无 2007 式打包拼接，满足 model_class 单张量硬约束。
    reference 实现为同族前向构图 + torch.autograd.grad 纯 ATen 组合
    （index_add 全部在 reference 内，不受 forbidden 约束；全 n_k = 0 时
    autograd allow_unused 返回 None，题目置全零）。留作后续的变体：igemm
    系三个样例（隐式 GEMM 形式 + 索引表生成）、grouped/bias 路径（样例不
    含）、非方形 kv 维度分解（样例 kv 为标量 kernel volume，题目沿用标量
    口径）。样例不含官方测试文件，语义自检以独立朴素 oracle（(k, j) 标量
    索引双循环、float64 散射/外积累加，与 autograd 完全不同代码路径）对
    autograd reference 交叉验证（tmp/build_check/5006_spconv_bwd.py，最大
    偏差见该脚本输出）。
    case 文件为 {name + 语义字段} 字典，消费者剥离 name 元数据键后调
    题目文件内 make_inputs(**fields) 确定性生成
    （torch.Generator(seed)，消费顺序 features -> filters -> out_bp ->
    counts -> in_tab -> out_tab；num_act_out 为 case 字段、不是 forward
    形参）；Model 构造超参由 audit_model_class.resolve_init_args 按
    task.yaml io.init_inputs 字段名从 case 取（variant 在 case 内）。
