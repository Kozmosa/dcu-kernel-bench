  decision: admitted
  reviewer: "Codex（首次准入执行 agent）"
  date: "2026-09-25"
  note: >
    准入对象为 aiter 的 Triton decode 路径：paged_attention_decode / paged_attn_decode_v1
    （aiter/ops/triton/pa_decode.py，2294 行，核心计算在 _paged_attn_decode_v1_wo_dot_kernel
    与 _paged_attn_decode_v1_w_dot_kernel，在线 softmax + tl.dot，无任何外部库调用，
    仅依赖 triton/torch 运行时）。
    审核排除说明：aiter 另有两条 paged attention 路径——(1) ops/attention.py 的
    module_pa / module_pa_ragged（vLLM v1/v2 HIP kernel），经查不在
    aiter/jit/optCompilerConfig.json 构建配置中，依赖预编译 aiter_ 扩展，不可独立复现，
    不符合准入标准；(2) chunked_pa_prefill.py（Triton prefill）语义不同，留作独立候选。
    任务范围界定：单 token decode、MHA + GQA、fp16/bf16 非量化 KV、无 ALiBi /
    滑窗 / blocksparse、max_seq_len <= 8192（v1 调度域）；v2 flash-decoding 与
    fp8/int8 量化变体留作后续独立任务。
