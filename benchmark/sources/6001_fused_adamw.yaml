      sha256: ba1411b51a1484eee9389cd299c284caffef9f19b9cc90451fa277956d164e0b
      role: official_test   # 属性证据：transformeradamw=false + 提供 max_exp_avg_sqs；io=half / compute=FLOAT——fp16 io、fp32 内部计算口径的样例依据
    - path: cpp/adamw/TransformerAdamw.cpp
      sha256: df4fdc8a377e20c9b2f5b702d5311d5fbacb0864dccfad6668f66899adffc6bb
