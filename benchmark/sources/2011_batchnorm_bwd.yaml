      sha256: 1a9fc9083691ddea8dcdee418d1f57255a883e36696a86092f8400a05db36aaf
      role: device_kernel   # batchnorm_backward graph：dy/x/scale/saved_mean/saved_inv_variance -> dx/dscale/dbias，variant="dx" 的 I/O 契约来源（fp32，NCHW contiguous）
    - path: python/batchnorm/batchnorm_backward_weight.py
      sha256: 35c8289a3927c4920172d2c212ff1605374e49ebb31ffba0b206e9e257fd8311
