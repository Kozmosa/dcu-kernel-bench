  note: >
    题面取训练用 Add+SwiGLU 的前向 + 一阶反向子集：
    silu((base+delta)[...,:D]) * (base+delta)[...,D:] 与其解析梯度
    （SiLU 导数公式；base/delta 以相同系数进入和式，两路梯度逐元素相同），
    以单次 forward 输出拼接张量 [out|grad_gate|grad_up] 落入 KernelBench
    model_class 形态——在线评测器要求单张量输出且运行于 no_grad，故梯度以
    解析式进入被评契约，autograd 集成 / once_differentiable 不进在线契约。
    语义依据官方测试 test_values_and_gradients（前向值 + x.grad/y.grad 对比，
    覆盖 (0,64)/(17,66)/(257,28672) × fp16/bf16 × train_base/recompute 组合）
    与 test_shared_input_accumulation（共享输入时 autograd 负责累加，本题
    输出单路梯度，构建自检中按 2×单路梯度复核）。源码与测试无冲突。源
    kernel 显式复现 eager dtype 舍入边界（逐级 round 到输入 dtype），本题
    容差 2e-2/2e-2 覆盖舍入路径差异，不要求逐位一致。其余变体留作后续题：
    moe_activation.py 的 swiglu_variant_1d（无 Add 输入、无训练反向，独立
    成题）；checkpoint 重算、二阶梯度、torch.compile 兼容均非本题范围。
