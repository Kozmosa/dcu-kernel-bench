  note: >
    语义依据为官方测试 test_gemm_a16_w16：Y = X @ W^T（x [M,K] 与
    weight [N,K] 行主 TN，fp16/bf16），kernel 内 float32 累加
    （tl.dot input_precision="ieee"）后整体 cast 回输出 dtype，与
    F.linear(x, w, bias=None) 在 atol=rtol=1e-1 内一致。题面取常规分块
    store 变体：每个输出 tile 由单一 program 完整归约 K 维（EVEN_K 不成立
    时 K 尾按 0 参与累加；M/N 越界行/列取模回绕加载 + 掩码写回），无
    split-K、无原子加、无量化成分（"A16W16" 指双方均为 16 位浮点）。
    同族边界裁定：与 4007_gemm_a16w16_atomic 为同一官方测试下的两份
    算子源文件，数学语义相同、差异在归约/写回策略（常规 store vs
    split-K + tl.atomic_add）；因 4007 已作为独立任务在库，按目录既有
    状态保留为独立两题（4006 常规 store / 4007 split-K atomic，即
    基础/进阶两问），公开 shape 族（4006: 256x8192x1024 bf16 /
    4007: 64x1280x4096 f16）与 case 资产互不重叠。官方测试中
    output=True 显式传入输出张量、TT/NT/NN 布局变体与 atomic 路径不在
    本题范围（atomic 留作 4007，非 TN 布局留作后续题）。源码与测试无
    语义冲突。与 1002 样板的一处形态差异（复核后修正）：task.yaml 不再
    内联 repo/commit/path 溯源串（隔离检查对题面包文件 grep -i 命中
    opendas/c39fff8），完整溯源只记于本文件。
