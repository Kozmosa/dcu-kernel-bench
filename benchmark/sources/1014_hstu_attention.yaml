  note: >
    题面变体子集：HSTU attention 前向（jagged varlen：q/k/v [total,H,D*] 按
    seq_offsets 分段），causal 与非 causal 两态；num_targets 恒为张量输入
    （g=0 等价官方 num_targets=None 路径）；contextual_seq_len /
    max_attn_len 作为 __init__ 开关（0=关闭）；N=max_seq_len 兼作缩放分母
    与长度上界；alpha 缺省 qk_dim^-0.5；输出仅 out（与 v 同 dtype，
    v_dim 可不等于 qk_dim）。语义依据：官方测试所对照的参考实现
    torch_hstu_attention + _get_valid_attn_mask（位置重编号 clamp(min=0) /
    clamp(max=max_ids)、eye|dist>0 为有效、max_attn_len 求交、contextual
    行放宽、F.silu(qk*alpha)/max_seq_len 后乘 V），与被测 kernel
    _hstu_attn_fwd/_hstu_attn_fwd_one_block（SiLU 以
    fast_dividef(qk,1+fast_expf(-qk)) 自实现、silu 权重 cast 到输入 dtype
    后 tl.dot）一致。与官方测试的冲突处理：无冲突；两点口径说明：
    ① 官方测试取 alpha = 1/attn_dim*10000，alpha 是算子的自由输入参数，
    题面缺省改为本评测集惯例的 qk_dim^-0.5，不构成语义分歧；② 官方
    generate_sparse_seq_len 在 sparsity < 0.5 时可产生 0 长序列，题面显式
    允许空序列并以 hidden case 覆盖。其余变体留作后续题：反向 kernel
    （_hstu_attn_bwd* 与 _AttentionFunction.backward）、IS_DELTA_Q 前向
    变体（包装层恒为 False，未被官方测试覆盖）、sort_by_length_indices
    （纯调度优化，语义不变）。
