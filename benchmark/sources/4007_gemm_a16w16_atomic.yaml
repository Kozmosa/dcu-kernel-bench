  note: >
    语义依据为官方测试 test_gemm_a16_w16_atomic：Y = X @ W^T（x [M,K] 与
    weight [N,K] 行主 TN，fp16/bf16），分片 float32 累加经 tl.atomic_add
    合并写回；官方测试将累加输出置为 fp32 再整体 cast 回输入 dtype，源码
    注释自认 bf16 直接原子累加有精度损失，故题面语义取"float32 累加一次、
    输出单次 dtype 收缩"。题面子集：无 bias、单输出张量、M/N/K 任意正整数
    （含 1 与非 2 次幂，K 不要求分块对齐）。官方测试中的非 atomic
    gemm_a16w16 路径、output=True/False 显式传入输出张量、非 TN layout
    变体不在本题范围，留作后续题。参考实现以 float32 一次性累加等价替代
    split-K 原子合并，与官方参考 F.linear 在容差内一致；split-K 分片数与
    并行策略由提交实现自行决定，以输出容差判定。
