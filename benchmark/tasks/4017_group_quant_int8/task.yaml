id: "4017_group_quant_int8"
name: per_token_group_quant_int8
family: quant_gemm
impl_lang: triton
entry: model_class          # KernelBench 兼容形态：Model/ModelNew + get_inputs/get_init_inputs
difficulty: hard            # catalog level 映射：basic=1 / medium=2 / hard=3

description: >
  per-token-group int8 动态量化（W8A8 整数 GEMM 的激活前处理）：把连续 2D
  float 张量按行主序切成 group_size 大小的连续分组，每组以 float32 求
  absmax（与 eps 取 max 防除零），scale = absmax/127，码字 = 向零截断的
  clamp(x/scale, -128, 127) 转 int8。输出按 KernelBench 单张量协议两段打包
  为一维 float32：前 rows*cols 个元素为 int8 码字（整数），后
  rows*cols/group_size 个为各组 scale。本题为自包含的 KernelBench 题目文件
  （reference.py 即题目文件，同时镜像到 benchmark/kernelbench_compat/level3/），
  可直接走 PyramidKernel 的原生 model_class 路径（--kernelbench-root
  benchmark/kernelbench_compat --level 3 --problem-id 4017），无需任何框架改动。
  starter 由框架 loader 从 Model 自动生成 ModelNew scaffold（锚点：
  helpers / init_body / forward_stmt_N），本任务包不单独提供 starter。

io:
  inputs:
    - {name: x, dtype: [float16, bfloat16], layout: contiguous, ndim: 2, shape: [rows, cols]}
  outputs:
    - {name: out, dtype: float32, layout: contiguous, ndim: 1, shape: [rows*cols + rows*cols/group_size]}   # [码字段 | scale 段] 两段打包
  init_inputs:
    - {name: group_size, dtype: int64, layout: scalar}   # 默认 128
    - {name: eps, dtype: float64, layout: scalar}        # 默认 1e-10，除零保护

shape:
  # get_inputs() 固定的 shape 族（在线评测单一实例；全域约束见下）
  fixed_family: {rows: 128, cols: 7168, group_size: 128, eps: 1.0e-10, dtype: float16}
  dynamic: true
  invariants:
    - "cols % group_size == 0（官方 wrapper 同名断言；不满足即非法输入）"
    - "x 为 2D 连续 float 张量；rows/cols >= 1，允许非 2 次幂；group_size 可为整除 cols 的任意正整数（含 1）"
    - "输出打包契约：out[:rows*cols] 为码字（float32 表示的整数），out[rows*cols:] 为 scale"
    - "M = rows*cols 不必整除 128（如 rows=3, cols=192, group_size=64），尾部由 kernel 掩码处理"

tolerance:
  float32:  {atol: 1.0e-6, rtol: 1.0e-6}
  compare: >
    输出为单个一维 float32 张量（码字段 + scale 段两段打包），**两段各用各的容差**
    （见下方 tolerance_segments）：码字段允许 ±1 个码字、但失配元素比例必须 <= 1%；
    scale 段仍为 1e-6。
  note: >
    本题输出 dtype 为 float32（无 fp16/bf16 浮点输出，不适用 2.0e-2 档）。
    scale 段收紧为 1e-6：reference 与合规候选的中间算术同为 fp32（absmax 精确、
    scale 为单次 fp32 除法），1e-6 覆盖倒数乘法等 1-2 ulp 算术变体。
    **码字段允许 ±1（2026-10 修正，实测证据）**：原先要求"任何偏差 >= 1 即语义错误"
    的前提不成立——组内 absmax 元素本应量化为 ±127，但 absmax/(absmax/127) 在 fp32
    下不严格等于 127，向零截断后会落到 ±126。aiter 官方 Triton kernel 与
    PyTorch reference 在此处因除法舍入不同而相差 1 个码字，实测失配占
    (4096x7168 gs128) 0.068% / (8192x4096 bf16) 0.067%，且差值恒为 1（无 >= 2 者）。
    若坚持 1e-6，一个写法正确的 Triton 实现同样会失败（它与 Triton 的除法一致、
    而非与 PyTorch 的除法一致），本题将不可解。故把码字段放宽到 ±1，**且不设失配
    预算（max_mismatch_frac 缺省 0）**：实测差值恒为 1、无一元素超过 1，无需额外
    放宽；任何偏差 >= 2 仍直接判失败。
    在线（搜索循环内）由 KernelBenchPaperEvaluator 判定：triton 后端输入与模型
    统一 cast 为 fp32、allclose(atol=rtol=1e-4)，与上表不同——在线结论不能替代终审。

# 输出两段的边界由 reference.output_segments() 给出（码字段在前、scale 段在后）
tolerance_segments:
  - {name: codes,  atol: 1.0,     rtol: 1.0e-6}
  - {name: scales, atol: 1.0e-6,  rtol: 1.0e-6}

# 终审静态审计沿用（在线仅靠 Model docstring 软约束）；标准列表中 attention /
# GEMM / softmax 类捷径与本纯量化算子无关，按题裁剪，保留 aiter 并加量化 ATen 捷径
forbidden:
  - aiter
  - torch.quantize_per_tensor
  - torch.quantize_per_channel

source:
