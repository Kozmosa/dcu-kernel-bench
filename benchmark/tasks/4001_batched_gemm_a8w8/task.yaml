id: "4001_batched_gemm_a8w8"
name: batched_gemm_a8w8
family: quant_gemm
impl_lang: triton
entry: model_class          # KernelBench 兼容形态：Model/ModelNew + get_inputs/get_init_inputs
difficulty: hard            # catalog level 映射：basic=1 / medium=2 / hard=3

description: >
  batch 维 int8 量化 GEMM：int8 激活 (B,M,K) × int8 权重 (B,N,K)（行主存放，
  转置 GEMM 语义），float32 累加后外乘 per-token scale (B,M,1) 与
  per-channel scale (B,1,N) 反量化，可选加 bias (B,1,N)；输出 (B,M,N)，
  dtype 为 bfloat16/float16。本题为自包含的 KernelBench 题目文件
  （reference.py 即题目文件，同时镜像到 benchmark/kernelbench_compat/level3/），
  可直接走 PyramidKernel 的原生 model_class 路径（--kernelbench-root
  benchmark/kernelbench_compat --level 3 --problem-id 4001），无需任何框架改动。
  starter 由框架 loader 从 Model 自动生成 ModelNew scaffold（锚点：
  helpers / init_body / forward_stmt_N），本任务包不单独提供 starter。

io:
  inputs:
    - {name: xq,      dtype: int8,                layout: contiguous, ndim: 3, shape: [B, M, K]}
    - {name: wq,      dtype: int8,                layout: contiguous, ndim: 3, shape: [B, N, K]}
    - {name: x_scale, dtype: float32,             layout: contiguous, ndim: 3, shape: [B, M, 1]}
    - {name: w_scale, dtype: float32,             layout: contiguous, ndim: 3, shape: [B, 1, N]}
    - {name: bias,    dtype: [bfloat16, float16], layout: contiguous, ndim: 3, shape: [B, 1, N]}   # use_bias=False 时为占位张量，forward 忽略
  outputs:
    - {name: out, dtype: [bfloat16, float16], layout: contiguous, ndim: 3, shape: [B, M, N]}
  init_inputs:
    - {name: use_bias,  dtype: bool, layout: scalar}
    - {name: out_dtype, dtype: str,  layout: scalar}   # "bfloat16" | "float16"

shape:
  # get_inputs() 固定的 shape 族（在线评测单一实例；全域约束见下）
  fixed_family: {B: 4, M: 128, N: 256, K: 512, use_bias: true, out_dtype: "bfloat16"}
  dynamic: true
  invariants:
    - "xq.shape[2] == wq.shape[2]（K 维一致）"
    - "x_scale 形状 (B, M, 1)、w_scale 形状 (B, 1, N)，float32"
    - "bias 形状 (B, 1, N)，dtype 与 out_dtype 一致；use_bias=False 时可被忽略"
    - "码字值域 [-20, 20)；B/M/N/K >= 1，允许非 2 次幂与 K 不整除 tile"

tolerance:
  float16:  {atol: 2.0e-2, rtol: 2.0e-2}
  bfloat16: {atol: 2.0e-2, rtol: 2.0e-2}
  compare: "reference 以 float32 GEMM 累加、按 kernel 融合顺序 cast 后比较输出 dtype"
  note: >
    以上为本评测集的验收容差，用于离线终审。int8 码字乘积精确、fp32 累加误差
    可忽略，误差主要来自输出 dtype 的舍入（bf16 相对精度约 4e-3）与 bias 分支
    的提前 cast，2.0e-2 覆盖且无需更宽。在线（搜索循环内）由
    KernelBenchPaperEvaluator 判定：triton 后端输入与模型统一 cast 为 fp32、
    allclose(atol=rtol=1e-4)，与上表不同——在线结论不能替代终审。

# 终审静态审计沿用（在线仅靠 Model docstring 软约束）
forbidden:
  - torch.matmul
  - torch.bmm
  - torch.mm
  - torch.addmm
  - torch.einsum
  - torch._int_mm
  - F.linear
  - functional.linear
  - aiter
