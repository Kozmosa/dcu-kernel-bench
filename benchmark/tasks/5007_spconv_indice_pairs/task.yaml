id: "5007_spconv_indice_pairs"
name: spconv_indice_pairs
family: conv
impl_lang: hip
entry: model_class          # KernelBench 兼容形态：Model/ModelNew + get_inputs/get_init_inputs
difficulty: medium          # catalog level 映射：basic=1 / medium=2 / hard=3

description: >
  稀疏卷积 indice pairs 生成（spconv 风格 kernel map 构建，Native 算法、非
  subm）：输入活跃点表 indices (n, ndim+1)（列 0 为 batch 下标、其余为空间
  坐标，行互异、顺序任意）与 6 个构造超参（batch_size / input_dims / ksize /
  stride / padding / dilation），按下述规则生成三个 int32 索引表并打包为
  单张量输出——派生 kv=prod(ksize) 与
  output_dims[d]=(D+2P-dil*(K-1)-1)//S+1；kernel 偏移按 C-order 分解（第 0
  维最慢）；按外层 k、内层输入行 i 的顺序枚举，对每维以
  val = x_d + P - o_d*dil 判定整除（val % S[d] == 0）与范围（0 <= val//S[d]
  < output_dims[d]），整除且在界内者有效，输出坐标 q_d = val // S[d]；
  有效输出坐标按首次出现序递增编号写入 out_indices（容量 cap =
  min(kv*n, batch_size*prod(output_dims))，行号 >= 有效数 m 的行填 -1）；
  indice_pairs (2, kv, n) 先全填 -1，每个偏移 k 的第 c 个有效对写密集前缀
  槽位——平面 0 = 输入行号 i（gather 源）、平面 1 = 输出行号 r（scatter 目
  标）；indice_num_per_loc (kv,) 记录各偏移有效对数。输出为一维 int32：
  out_indices 段（cap*(ndim+1)）+ indice_pairs 段（2*kv*n）+
  indice_num_per_loc 段（kv），总数 cap*(ndim+1)+2*kv*n+kv 由超参唯一决定。
  索引语义精确匹配（行号顺序 / 槽位顺序 / -1 填充逐位一致，无容差）。整型
  输入在线评测被 cast 成 fp32，索引值 <= 2^24 时精确，实现需恢复 int32。
  本题为自包含 KernelBench 题目文件（reference.py 即题目文件，同时镜像到
  benchmark/kernelbench_compat/level2/），可直接走 PyramidKernel 原生
  model_class 路径（--kernelbench-root benchmark/kernelbench_compat
  --level 2 --problem-id 5007），无需任何框架改动。starter 由框架 loader
  从 Model 自动生成 ModelNew scaffold（锚点：helpers / init_body /
  forward_stmt_N），本任务包不单独提供 starter。

io:
  inputs:
    - {name: indices, dtype: int32, layout: contiguous, ndim: 2, shape: "[n, ndim+1]；列 0 = batch 下标，列 1..ndim = 空间坐标，行互异"}
  outputs:
    - {name: out, dtype: int32, layout: contiguous, ndim: 1, shape: "[cap*(ndim+1) + 2*kv*n + kv]，cap = min(kv*n, batch_size*prod(output_dims))；三段打包——out_indices 段 / indice_pairs 段 / indice_num_per_loc 段（协议见 description 与 docstring）"}
  init_inputs:
    - {name: batch_size, dtype: int, layout: scalar}
    - {name: input_dims, dtype: int 列表（ndim 个）, layout: list}
    - {name: ksize,      dtype: int 列表（ndim 个）, layout: list}
    - {name: stride,     dtype: int 列表（ndim 个）, layout: list}
    - {name: padding,    dtype: int 列表（ndim 个）, layout: list}
    - {name: dilation,   dtype: int 列表（ndim 个）, layout: list}

shape:
  # get_inputs() 固定的 shape 族（在线评测单一实例；shape 全域约束见下）
  fixed_family: {n: 1024, batch_size: 2, input_dims: [4, 32, 32], ksize: [3, 3, 3], stride: [1, 1, 1], padding: [1, 1, 1], dilation: [1, 1, 1], dtype: "int32"}
  dynamic: true
  invariants:
    - "ndim ∈ [1, 3]（允许 1D/2D/3D，各维长度允许非 2 的幂）；n >= 1 且 n <= batch_size*prod(input_dims)（活跃点行互异）"
    - "各维超参：D >= 1、K >= 1、S >= 1、P >= 0、dil >= 1、output_dims >= 1；索引值全部 <= 2^24（fp32 可精确表示）"
    - "有效输出行数 m ∈ [0, min(kv*n, batch_size*prod(output_dims))]，不单独输出，由 out_indices 段的 -1 行与 indice_num_per_loc 隐含；个别偏移的有效对数可为 0"
    - "输出为索引（无浮点 dtype 变体）：三段全部逐位一致，-1 填充区语义由题面规则唯一确定，任何顺序差异判负"

tolerance:
  int32:     {atol: 0.0, rtol: 0.0}
  compare: "整型索引输出无容差：按三段划分逐位比较——out_indices 段（含 -1 填充行）、indice_pairs 段（含 -1 填充槽位）、indice_num_per_loc 段；行号顺序（首次出现序）、槽位顺序（每偏移密集前缀）、填充值（-1）均由题面规则唯一确定，任何一位不等即判负"
  note: >
    以上为本评测集的验收容差，用于离线终审。索引是离散量：正确实现与
    reference 必然逐位相等（构建自检 tmp/build_check/5007_spconv_indice_pairs.py
    逐 case 实测最大绝对偏差 0），取 atol=rtol=0 保证不放过任何顺序/去重/
    填充偏差。在线（搜索循环内）由 KernelBenchPaperEvaluator 判定：输入统一
    cast 为 fp32、allclose(atol=rtol=1e-4)——对整型输出等价于逐位一致
    （任何非零整数差 >= 1 >> 1e-4），与上表相容。在线结论不能替代终审。

# 终审静态审计沿用（在线仅靠 Model docstring 软约束）
# 去重 / 排序 / 计数类的 ATen 拼装路线整体封死，核心 hash 去重必须进 HIP
forbidden:
  - aiter
  - miopen
  - hipdnn
  - torch.unique
  - unique_consecutive
  - torch.sort
  - torch.argsort
  - torch.msort
  - .sort(
  - .argsort(
  - torch.mode
  - torch.histc
  - torch.bincount
  - torch.topk
  - scatter
  - index_put
  - segment_reduce

