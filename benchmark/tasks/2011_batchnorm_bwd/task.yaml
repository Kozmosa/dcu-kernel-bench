id: "2011_batchnorm_bwd"
name: batchnorm_bwd
family: norm
impl_lang: hip
entry: model_class          # KernelBench 兼容形态：Model/ModelNew + get_inputs/get_init_inputs
difficulty: hard            # catalog level 映射：basic=1 / medium=2 / hard=3

description: >
  BatchNorm 训练反向家族（NCHW）：给定上游梯度 dy、前向输入 x、缩放参数
  scale 与前向保存的统计量 saved_mean / saved_inv_variance（均为 (1,C,1,1)
  float32，恒为前向时保存值，inv_variance = 1/sqrt(有偏方差 + eps)，反向
  数学本身不含 eps），在 float32 中按如下定义计算梯度：
      xhat      = (x - saved_mean) * saved_inv_variance
      dgamma[c] = sum_{n,h,w} dy * xhat
      dbeta[c]  = sum_{n,h,w} dy
      dx        = (scale * saved_inv_variance / m) *
                  (m*dy - dbeta - xhat * dgamma)      （m = N*H*W）
  saved 统计量按给定值原样消费，不得由 x 重新计算（可为与 x 真实统计量
  无关的任意正数）。variant="dx" 时输出单张量 dx，(N,C,H,W)、同输入
  dtype；variant="dgamma_dbeta" 时输出单张量一维打包 (2*C,)——前 C 个为
  dgamma、后 C 个为 dbeta（各 float32 计算后 cast 回输入 dtype、按行主序
  平铺，dgamma 段在前），评测器按单输出比较。float32 为主，另设
  fp16/bf16（中间计算与归约全程 float32，输出 cast 回输入 dtype；统计量
  恒为 float32）。N/C/H/W 任意（含 1、非 2 的幂、不对齐，通道归约需掩码
  / 分块）。本题为自包含 KernelBench 题目文件（reference.py 即题目文件，
  同时镜像到 benchmark/kernelbench_compat/level3/），可直接走 PyramidKernel
  的原生 model_class 路径（--kernelbench-root benchmark/kernelbench_compat
  --level 3 --problem-id 2011），无需任何框架改动。starter 由框架 loader
  从 Model 自动生成 ModelNew scaffold（锚点：helpers / init_body /
  forward_stmt_N），本任务包不单独提供 starter。

io:
  inputs:
    - {name: dy,                 dtype: [float32, float16, bfloat16], layout: contiguous, ndim: 4, shape: [N, C, H, W]}
    - {name: x,                  dtype: same_as_dy, layout: contiguous, ndim: 4, shape: [N, C, H, W]}
    - {name: scale,              dtype: same_as_dy, layout: contiguous, ndim: 4, shape: [1, C, 1, 1]}
    - {name: saved_mean,         dtype: float32,    layout: contiguous, ndim: 4, shape: [1, C, 1, 1]}
    - {name: saved_inv_variance, dtype: float32,    layout: contiguous, ndim: 4, shape: [1, C, 1, 1]}
  outputs:
    - name: out
      dtype: same_as_dy
      layout: contiguous
      ndim: "4 或 1"
      shape: "dx：(N, C, H, W)；dgamma_dbeta：(2*C,) 一维打包——前 C 个 dgamma、后 C 个 dbeta"
      note: "forward 恒返回单张量（评测器按单输出比较）；打包协议见 description"
  init_inputs:
    - {name: variant, dtype: str, layout: scalar}   # "dx" | "dgamma_dbeta"

shape:
  # get_inputs() 固定的 shape 族（在线评测单一实例；hidden/perf case 覆盖全域）
  fixed_family: {N: 4, C: 16, H: 56, W: 56, variant: "dx", dtype: "float32", stats: "derived"}
  dynamic: true
  invariants:
    - "N >= 1、C >= 1、H >= 1、W >= 1（允许 1、非 2 的幂、不对齐维度；m = N*H*W 任意，通道内归约需掩码 / 分块，元素一个不漏）"
    - "saved_mean / saved_inv_variance 恒为 float32、形状 (1,C,1,1)，saved_inv_variance 元素恒为正；两者按给定值原样消费，可为与 x 的真实统计量无关的值，禁止由 x 重算"
    - "输入值域为常规 randn 量级（无 inf/NaN）；归约与中间计算全程 float32，输出 cast 回输入 dtype；输入均为 NCHW contiguous（channels_last 不在本题域）"

tolerance:
  float32:  {atol: 1.0e-3, rtol: 1.0e-3}
  float16:  {atol: 2.0e-2, rtol: 2.0e-2}
  bfloat16: {atol: 2.0e-2, rtol: 2.0e-2}
  compare: "reference 以 float32 计算后 cast 到输出 dtype 再比较；variant=dx 整张同容差；variant=dgamma_dbeta 的单张量输出按段检验——前 C 个元素（dgamma）与后 C 个元素（dbeta）用同一容差"
  note: >
    float32 档的容差为通道归约不同求和顺序（逐块累加 / 两遍归约）的
    float32 重结合误差留出余量。以上为本评测集的验收容差，用于离线终审，
    与 2010 同口径前向（batch_norm 训练语义）autograd 反传的交叉验证相容
    （构建自检实测闭式解与 autograd 一致性在 1e-6 量级）。在线（搜索循环
    内）由 KernelBenchPaperEvaluator 判定：cuda 后端输入与模型统一 cast
    为 fp32、allclose(atol=rtol=1e-4)，与上表不同——在线结论不能替代终审。

# 终审静态审计沿用（在线仅靠 Model docstring 软约束）。
# 条目按 2007_rmsnorm 家族口径写成 API 全限定形式、不用裸子串
# （batch_norm / batchnorm 裸词会误杀命名如 _batchnorm_bwd_kernel 的
# 合法 HIP kernel）；miopen/cudnn/hipdnn 等闭源库由全局黑名单覆盖。
forbidden:
  - aiter
  - torch.batch_norm
  - torch.native_batch_norm
  - torch.nn.functional.batch_norm
  - F.batch_norm
  - torch.nn.BatchNorm1d
  - torch.nn.BatchNorm2d
  - torch.nn.BatchNorm3d
  - torch.ops.aten.batch_norm
  - torch.ops.aten.native_batch_norm
  # 反向题：禁止借 autograd 反传求梯度（torch.autograd / autograd.grad /
  # tensor.backward）
  #（注释须独立成行：static_audit.py 的 forbidden 解析器不识别行尾注释）
  - autograd
  - .backward(

# 溯源（repo/commit/path/sha256）统一记录于 benchmark/sources/2011_batchnorm_bwd.yaml；
# 题面三文件与 compat 镜像内不得重复出现溯源词。
