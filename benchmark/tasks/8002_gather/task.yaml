id: "8002_gather"
name: gather
family: index
impl_lang: hip
entry: model_class          # KernelBench 兼容形态：Model/ModelNew + get_inputs/get_init_inputs
difficulty: basic           # catalog level 映射：basic=1 / medium=2 / hard=3

description: >
  Gather / GatherElements 索引选择家族（纯索引搬移，无算术）：
  variant="gather" 时 indices 为一维整数向量（长度 K），沿 axis 维一次
  选取——out[i_0,..,i_{axis-1}, j, i_{axis+1},..] =
  data[i_0,..,i_{axis-1}, indices[j], i_{axis+1},..]，输出形状为 data
  形状把第 axis 维替换为 K；variant="gather_elements" 时 indices 与
  data 同维数、除第 axis 维外各维长度与 data 一致（第 axis 维长度 K
  可与 data 不同），out[i_0,..,i_{n-1}] = data[i_0,.., m, .., i_{n-1}]，
  其中 m = indices[i_0,..,i_{n-1}]（每个输出元素沿 axis 独立取下标），
  输出形状 = indices 形状。axis 为 Model 构造超参（torch 惯例：非负从
  0 起、负数从末尾计数），固定 shape 族取 axis=1、variant="gather"、
  3-D float32 data（与样例口径一致）。dtype 域 float32 为主，另含
  float16/bfloat16——本算子是纯搬移，正确实现与被选中元素逐位一致，
  低精度 dtype 数值安全（见 tolerance）。输出与 data 同 dtype，forward
  返回单个张量（本算子天然单输出，无需多输出打包）。shape 域在样例
  口径上放宽：ndim 1–4、各维 >= 1（含 1、非 2 的幂、素数长度）、
  K >= 1（可大于或小于 data.shape[axis]）。本题为自包含 KernelBench
  题目文件（reference.py 即题目文件，同时镜像到
  benchmark/kernelbench_compat/level1/），可直接走 PyramidKernel 的原生
  model_class 路径（--kernelbench-root benchmark/kernelbench_compat
  --level 1 --problem-id 8002），无需任何框架改动。starter 由框架
  loader 从 Model 自动生成 ModelNew scaffold（锚点：user_helpers / cuda_cpp / cuda_cu / init_body / forward_stmt_N），本任务包不单独提供 starter。

io:
  inputs:
    - {name: data,    dtype: [float32, float16, bfloat16], layout: contiguous,
       ndim: "1-4", shape: "各维 >= 1，元素总数 <= 2^23"}
    - {name: indices, dtype: "gather: int64（一维） / gather_elements: int32（与 data 同维数）",
       layout: contiguous, ndim: "gather: 1 / gather_elements: same_as_data",
       shape: "gather: (K,)；gather_elements: 除 axis 维外各维同 data；值域 [0, data.shape[axis])"}
  outputs:
    - {name: out, dtype: same_as_data, layout: contiguous, ndim: same_as_data,
       shape: "gather: data 形状将 axis 维替换为 K；gather_elements: indices 形状"}
  init_inputs:
    - {name: variant, dtype: str, layout: scalar}   # "gather" | "gather_elements"
    - {name: axis,    dtype: int, layout: scalar}   # 选择维，torch 惯例（负数从末尾计数）；固定 shape 族取 1

shape:
  # get_inputs() 固定的 shape 族（在线评测单一实例；shape 全域约束见下）
  fixed_family: {variant: "gather", axis: 1, data_shape: [2, 3, 4], index_shape: [2],
                 index_dtype: "int64", dtype: "float32", out_shape: [2, 2, 4]}
  dynamic: true
  invariants:
    - "data ndim ∈ [1, 4]，各维 >= 1，元素总数 <= 2^23（允许轴长 1、非 2 的幂、素数长度）"
    - "gather：indices 为一维 int64，长度 K >= 1；gather_elements：indices 为与 data 同维数的 int32，除 axis 维外各维长度与 data 一致，axis 维长度 K >= 1（允许 K ≠ data.shape[axis]）"
    - "索引值全部 ∈ [0, data.shape[axis])（在线评测把索引 cast 成 fp32 传入，< 2^24 可精确表示）；输入不含越界索引，实现无需越界防护但不得因掩码引入错误值"
    - "axis 按 torch 惯例指向 data 的既有维度（非负从 0 起，负数从末尾计数），同一 case 内固定；样例口径为 axis=1"
    - "dtype ∈ {float32, float16, bfloat16}，float32 为主（样例口径）；纯搬移无算术，输出与被选中元素逐位一致，低精度 dtype 数值安全"
    - "输入值为常规 randn 量级（无 inf/NaN）；data/indices contiguous，out 与 data 同 dtype、contiguous"

tolerance:
  float32:  {atol: 0.0, rtol: 0.0}
  float16:  {atol: 0.0, rtol: 0.0}
  bfloat16: {atol: 0.0, rtol: 0.0}
  compare: "本算子为纯索引搬移，无任何算术：正确实现的输出与 data 中被选中元素逐位一致，故三档 dtype 容差均为 0（allclose 即要求精确相等；输入无 inf/NaN，不存在 -0.0/+0.0 判负问题）"
  note: >
    纯搬移语义下不存在累加顺序/舍入差异，任何引入数值变换（如中间经
    float32 往返后未按原 dtype 位模式写回、fp16 与 bf16 重解释）的实现
    都会在容差 0 下判负——这正是本题考察点之一，构建自检
    （tmp/build_check/8002_gather.py）对全部隐藏 case 实测 reference 与
    独立 oracle（meshgrid 坐标网格 + 高级索引，与 torch.gather 不同代码
    路径）的最大绝对偏差为 0（torch.equal 逐位一致）。在线（搜索循环内）
    由 KernelBenchPaperEvaluator 判定：cuda 后端输入与模型统一 cast 为
    fp32、allclose(atol=rtol=1e-4)，与上表不同——在线结论不能替代终审。

# 终审静态审计：库级 gather/select 原语与已知等价绕过路径（tl 内建
# gather、flat take、embedding 查表）显式禁用——本题考察手写索引寻址；
# hipdnn 已在全局黑名单，此处显式列出以自文档。审计剥除 docstring 与
# 注释后按字面子串匹配（模型 docstring 中的禁用列表声明不会被误杀）。
forbidden:
  - torch.gather
  - .gather(
  - aten.gather
  - tl.gather
  - torch.index_select
  - .index_select(
  - aten.index_select
  - torch.take_along_dim
  - .take_along_dim(
  - aten.take_along_dim
  - torch.take(
  - .take(
  - aten.take
  - torch.embedding
  - nn.Embedding
  - .embedding(
  - hipdnn

