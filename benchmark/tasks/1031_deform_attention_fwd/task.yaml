id: "1031_deform_attention_fwd"
name: deform_attention_fwd
family: attention
impl_lang: hip
entry: model_class          # KernelBench 兼容形态：Model/ModelNew + get_inputs/get_init_inputs
difficulty: hard            # catalog level 映射：basic=1 / medium=2 / hard=3

description: >
  多尺度可变形注意力前向：value (N, n_keys, heads, D) 按多尺度特征层拼接，
  第 l 层贡献 spatial_shapes[l] = (H_l, W_l) 个键（层内行主序，起始偏移为
  level_start_index[l]，即各层键数前缀和），n_keys = Σ_l H_l*W_l；
  sampling_locations (N, Q, heads, L, P, 2) 最后一维为归一化坐标 (x, y)——
  第 0 通道沿 W、第 1 通道沿 H，生成域 [0,1)，实际采样坐标
  loc_x = x*W_l、loc_y = y*H_l；采样值经四角点双线性插值（角点越界贡献记 0
  的零填充语义，不做 clamp / 最近邻回拉）；attention_weights (N, Q, heads,
  L, P) 为非负未归一化分数，先沿 (levels×points) 展平一维做数值稳定 softmax
  （减最大值）归一化为凸组合权重，再与各采样点插值值加权求和。softmax、
  插值与加权归约全程 float32，输出 out 为单张量 (N, Q, heads*D)（天然单
  输出，无打包），cast 回 value dtype。fp32 为主，另含 fp16 档（float32
  中间计算后 cast 回）。shape 域含非 2 的幂与非 16 对齐维度、单层单像素
  (1,1)、1×N / N×1 细条层、Q=1、P=1、L=1 等边界值。本题为自包含
  KernelBench 题目文件（reference.py 即题目文件，同时镜像到
  benchmark/kernelbench_compat/level3/），可直接走 PyramidKernel 的原生
  model_class 路径（--kernelbench-root benchmark/kernelbench_compat
  --level 3 --problem-id 1031），无需任何框架改动。starter 由框架 loader 从
  Model 自动生成 ModelNew scaffold（锚点：user_helpers / cuda_cpp / cuda_cu / init_body / forward_stmt_N），本任务包不单独提供 starter。

io:
  inputs:
    - {name: value,              dtype: [float32, float16], layout: contiguous, ndim: 4, shape: [N, n_keys, heads, D]}
    - {name: spatial_shapes,     dtype: int64,              layout: contiguous, ndim: 2, shape: [L, 2]}
    - {name: level_start_index,  dtype: int64,              layout: contiguous, ndim: 1, shape: [L]}
    - {name: sampling_locations, dtype: same_as_value,      layout: contiguous, ndim: 6, shape: [N, Q, heads, L, P, 2]}
    - {name: attention_weights,  dtype: same_as_value,      layout: contiguous, ndim: 5, shape: [N, Q, heads, L, P]}
  outputs:
    - {name: out, dtype: same_as_value, layout: contiguous, ndim: 3, shape: "[N, Q, heads*D]；天然单张量输出，无多输出打包"}
  # 本题无构造超参（io.init_inputs 为空 => Model 无参构造）；公开/隐藏 case
  # 的字段名即 make_inputs 形参：n / n_heads / embed_dims_per_head /
  # n_queries / n_levels / n_points / spatial_shapes（可省略，缺省逐元素
  # randint[1, max_size]）/ max_size（可省略，缺省 15）/ dtype / seed
  init_inputs: []

shape:
  # get_inputs() 固定的 shape 族（在线评测单一实例；shape 全域约束见下；
  # 键名与 make_inputs/case 语义字段一致）
  fixed_family: {n: 2, n_queries: 32, n_heads: 2, embed_dims_per_head: 32, n_levels: 2, n_points: 2, spatial_shapes: "randint[1, 16)（逐轮随全局 RNG 变化，n_keys / value 形状由其推导）", dtype: "float32"}
  dynamic: true
  invariants:
    - "n / n_queries / n_heads / embed_dims_per_head / n_levels / n_points 均为任意正整数（允许 1、非 2 的幂、非 16 对齐）；每层 spatial_shapes[l] = (H_l, W_l) 且 H_l / W_l >= 1（随机生成域 [1, 15]，边界含 1）；n_keys = Σ_l H_l*W_l，value 第 1 维恒等于 n_keys（<= 2^24，保证 fp32 可精确表示索引）"
    - "level_start_index 必须是各层 H_l*W_l 的前缀和（首元素 0）；spatial_shapes / level_start_index 恒为 int64；在线评测器会把全部输入整体 cast fp32，实现须无损恢复为整数索引"
    - "sampling_locations 生成域 [0,1)（rand）：最后一维为 (x, y)，第 0 通道沿 W、第 1 通道沿 H，采样坐标 loc_x = x*W_l、loc_y = y*H_l；角点越界（<0 或 >dim-1）贡献记 0（零填充语义，不做 clamp / 最近邻回拉），坐标完全越界时采样值为 0"
    - "attention_weights 生成域 [0,1) 非负分数（未归一化）：金标先沿 (levels×points) 展平一维做数值稳定 softmax（减最大值）归一化为凸组合权重再加权；L*P=1 时权重恒为 1"
    - "输入值域常规（rand 张量 [0,1)，无 inf/NaN）；softmax、插值与加权归约全程 float32，输出 cast 回 value dtype；forward 返回单张量 (N, Q, heads*D)"

tolerance:
  float32: {atol: 1.0e-3, rtol: 1.0e-3}
  float16: {atol: 2.0e-2, rtol: 2.0e-2}
  compare: "reference 与生成实现均以 float32 中间计算（权重 softmax 归一化、四角点双线性插值、跨采样点加权归约），输出 cast 回 value dtype 后比较；容差按 case 的输入 dtype 取档，输出与输入同 dtype"
  note: >
    以上为本评测集的验收容差，用于离线终审。数值差异来源：softmax 与
    (levels×points) 加权归约的累加次序、双线性四角点加权求和的算术次序，
    构建自检 tmp/build_check/1031_deform_attention_fwd.py 逐 case 实测
    reference vs 独立逐元素 python oracle 的最大绝对/相对偏差（数字见
    sources yaml 记录），float32 档容差据此取 atol=rtol=1e-3；fp16 档输出
    值域 [0,1]，中间计算强制 float32 后仅剩输出 cast 量化误差与累加次序
    差，取 atol=rtol=2e-2（与 norm / conv 家族低精度档一致）。在线（搜索
    循环内）由 KernelBenchPaperEvaluator 判定：cuda 后端输入与模型统一
    cast 为 fp32、allclose(atol=rtol=1e-4)，与上表不同——在线结论不能替代
    终审。

# 终审静态审计沿用（在线仅靠 Model docstring 软约束）
forbidden:
  - torchvision
  - torchvision.ops.ms_deform_attn
  - ms_deform_attn
  - mmcv
  - miopen
  - hipdnn
  - aiter
  - torch.nn.functional.grid_sample
  - F.grid_sample
  - torch.nn.functional.interpolate
  - F.interpolate
  - torch.matmul
  - torch.bmm
  - torch.mm
  - torch.einsum
  - torch.tensordot
  - torch.softmax
  - torch.nn.functional.softmax
  - F.softmax

