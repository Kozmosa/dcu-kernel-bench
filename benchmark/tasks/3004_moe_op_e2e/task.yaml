id: "3004_moe_op_e2e"
name: moe_op_e2e
family: moe
impl_lang: triton
entry: model_class          # KernelBench 兼容形态：Model/ModelNew + get_inputs/get_init_inputs
difficulty: hard            # catalog level 映射：basic=1 / medium=2 / hard=3（level 3）

description: >
  融合 MoE 前馈（单 kernel 双 grouped GEMM + SwiGLU + 路由加权）的
  model_class（KernelBench 兼容）题目。算子语义：激活 a [M,K] 与专家权重
  w1 [E,N,K]（前 N/2 通道 gate、后 N/2 通道 up）、w2 [E,K,N/2]，
  路由结果 topk_ids [M,top_k] / topk_weights [M,top_k]，对每个 (m,j)：
  gate=a[m]@w1[e,:N/2].T、up=a[m]@w1[e,N/2:].T、h=SiLU(gate)*up、
  out[m,j,:]=topk_weights[m,j]*(h@w2[e].T)，输出 [M,top_k,K]。与
  moe_op 系列（GEMM 与激活分离的两 kernel 形态）为不同算子形态：本题把
  两段 grouped GEMM、SwiGLU 与路由加权融合在一次 kernel 调用内完成。
  接口取官方 torch 参考的用户级张量（a, w1, w2, topk_weights, topk_ids），
  排序对齐等调度中间量不属于算子语义、不进接口。本题为自包含的
  KernelBench 题目文件（reference.py 即题目文件，同时镜像到
  benchmark/kernelbench_compat/level3/），可直接走 PyramidKernel 的原生
  model_class 路径（--kernelbench-root benchmark/kernelbench_compat
  --level 3 --problem-id 3004），无需任何框架改动。
  starter 由框架 loader 从 Model 自动生成 ModelNew scaffold（锚点：
  helpers / init_body / forward_stmt_N），本任务包不单独提供 starter。

io:
  inputs:
    - {name: a,            dtype: [bfloat16, float32], layout: contiguous, ndim: 2, shape: [m, k]}
    - {name: w1,           dtype: same_as_a,            layout: contiguous, ndim: 3, shape: [e, n, k]}
    - {name: w2,           dtype: same_as_a,            layout: contiguous, ndim: 3, shape: [e, k, n//2]}
    - {name: topk_weights, dtype: same_as_a,            layout: contiguous, ndim: 2, shape: [m, top_k]}
    - {name: topk_ids,     dtype: int64,                layout: contiguous, ndim: 2, shape: [m, top_k]}
  outputs:
    - {name: out, dtype: same_as_a, layout: contiguous, ndim: 3, shape: [m, top_k, k]}
  init_inputs:
    - {name: top_k,       dtype: int64, layout: scalar}   # 仅元数据
    - {name: num_experts, dtype: int64, layout: scalar}   # 仅元数据；forward 以运行期张量形状为准

shape:
  # get_inputs() 固定的 shape 族（在线评测单一实例；全域约束见 invariants）
  fixed_family: {m: 32, n: 1024, k: 512, top_k: 2, num_experts: 8, dtype: bfloat16}
  dynamic: true
  invariants:
    - "n 为偶数（w1 前 n/2 通道为 gate、后 n/2 通道为 up）；w2.shape == [num_experts, k, n//2]"
    - "top_k <= num_experts；topk_ids 取值 [0, num_experts)，每行互异；topk_weights 与 a 同 dtype"
    - "m、k 为任意正整数（含 1，即 GEMV 情形）"
    - "case 键与 make_inputs 形参、io.init_inputs 名三方一致（top_k / num_experts）"

tolerance:
  bfloat16: {atol: 2.0e-2, rtol: 2.0e-2, max_mismatch_frac: 5.0e-3}
  float32:  {atol: 2.0e-2, rtol: 2.0e-2, max_mismatch_frac: 5.0e-3}
  compare: >
    reference 以 float32 计算后 cast 到输出 dtype 再比较；逐元素 atol=rtol=2e-2，
    另允许 <= 0.5% 的元素超限（灾难性抵消尾部，见 note）。
  note: >
    主体沿用本评测集默认容差：reference 与候选 kernel 都以 float32 累加、在输出处
    cast 一次，差异只剩累加序噪声与最终 cast 舍入（bf16 相对舍入 <= 2^-8 ≈ 0.0039
    << rtol 0.02）；构建自检对官方 fp32 oracle 的实测最大绝对偏差见
    sources/3004_moe_op_e2e.yaml 的 note。float32 case 无最终 cast，同容差下裕度更大。

    **失配预算 max_mismatch_frac=5e-3（2026-10 补，实测证据）**：原 note 断言
    "数学上必过"不成立。真实 MoE kernel 会把 SwiGLU 中间量 h 落到 compute dtype
    ——aiter 官方 kernel 的两条路径都是 `acc = (silu_acc * mul_acc).to(dtype)`
    （moe_op_e2e.py:261 非 persistent、:505 persistent）——而本 reference 让 h 保持
    fp32。题面的实现约束只要求"**中间累加**用 float32"（aiter 的 accumulator 确实是
    fp32），并未要求 h 保持 fp32；故两种做法都合法，容差必须同时容纳。

    实测 aiter 官方实现 vs 本 reference 的超差比例：
      perf_prefill_m1024_n4096_k2560  9115/5242880 = 0.174%
      perf_mid_m256_n2048_k1024       1375/524288  = 0.262%
      perf_decode_m8_n8192_k2048      0
    超差元素集中在**灾难性抵消**处：|ref| 接近 0，rtol 项失效，相对差可达 87% 但绝对
    差只有 1~4，atol 扛不住。故用失配预算而不是继续放大 atol/rtol——实测 atol=0.2
    时仍有 0.013% 超限，要靠 atol 全覆盖需要 ~4（荒谬）。预算取 0.5%（最坏实测
    0.262%，余量约 1.9x）。

    决定性实验（证明差异不是算法错误）：把 reference 的 h 也 cast 成 bf16 后，同一
    比对在 2e-2 下只差 1/5242880 = 0.00002%。**不采用"改 reference 让 h 变 bf16"
    的方案**：那会反过来惩罚更准确的 fp32 实现（方向相反）。

    拦截力：路由/专家选择错误会整条槽位错（top_k=2 时约 50% 元素）、激活写错会命中
    几乎全部元素，均远超声明的 0.5% 额度，仍会被拦下。

    在线（搜索循环内）由 KernelBenchPaperEvaluator 判定：triton 后端输入与模型
    统一 cast 为 fp32、allclose(atol=rtol=1e-4)，与上表不同——在线结论不能替代终审。

# 终审静态审计沿用（在线仅靠 Model docstring 软约束）
forbidden:
  - torch.matmul
  - torch.mm
  - torch.bmm
  - torch.baddbmm
  - torch.addmm
  - torch.einsum
  - torch.nn.functional.linear
  - F.linear
  - torch.nn.functional.silu
  - F.silu
  - torch.sigmoid
  - aiter

source:
