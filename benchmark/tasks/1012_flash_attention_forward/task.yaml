id: "1012_flash_attention_forward"
name: flash_attention_forward
family: attention
impl_lang: triton
entry: model_class          # KernelBench 兼容形态：Model/ModelNew + get_inputs/get_init_inputs
difficulty: hard            # catalog level 映射：basic=1 / medium=2 / hard=3

description: >
  变长序列（varlen）FlashAttention v2 前向的自包含 KernelBench 题目文件
  （reference.py 即题目文件，同时镜像到 benchmark/kernelbench_compat/level3/），
  可直接走 PyramidKernel 的原生 model_class 路径（--kernelbench-root
  benchmark/kernelbench_compat --level 3 --problem-id 1012）。稠密 Q/K/V 按
  cu_seqlens_q / cu_seqlens_k 分段，每段独立做 scaled dot-product attention：
  支持 MHA/GQA（num_q_heads 为 num_kv_heads 整数倍）、右下对齐因果掩码
  （causal=1，query i 只 attend key j <= i + L_k - L_q）、在线 softmax 数值
  稳定语义、float32 中间累加、输出 cast 回输入 dtype。题面约束每条序列
  0 < L_q <= L_k；不含 bias/ALiBi、dropout、fp8、LSE 输出。
  starter 由框架 loader 从 Model 自动生成 ModelNew scaffold（锚点：
  helpers / init_body / forward_stmt_N），本任务包不单独提供 starter。

io:
  inputs:
    - {name: q,            dtype: [float16, bfloat16], layout: contiguous, ndim: 3, shape: [total_q, num_q_heads, head_dim]}
    - {name: k,            dtype: same_as_q,           layout: contiguous, ndim: 3, shape: [total_k, num_kv_heads, head_dim]}
    - {name: v,            dtype: same_as_q,           layout: contiguous, ndim: 3, shape: [total_k, num_kv_heads, head_dim]}
    - {name: cu_seqlens_q, dtype: int32,               layout: contiguous, ndim: 1, shape: [num_seqs + 1]}
    - {name: cu_seqlens_k, dtype: int32,               layout: contiguous, ndim: 1, shape: [num_seqs + 1]}
    - {name: causal,       dtype: int32,               layout: scalar,     ndim: 0, note: "1=因果掩码，0=无掩码；上游评测器 cast fp32 后需无损恢复"}
  outputs:
    - {name: out, dtype: same_as_q, layout: contiguous, ndim: 3, shape: [total_q, num_q_heads, head_dim]}
  init_inputs:
    - {name: head_dim, dtype: int64, layout: scalar}   # sm_scale 缺省 1/sqrt(head_dim)

shape:
  # get_inputs() 固定的 shape 族（在线评测单一实例；hidden/perf case 覆盖全域）
  fixed_family: {num_seqs: 4, num_kv_heads: 4, query_group_size: 4, num_q_heads: 16, head_dim: 64, max_seq_len_q: 256, max_seq_len_k: 512}
  dynamic: true
  invariants:
    - "cu_seqlens_q/k 单调非降、首元素 0、尾元素分别为 total_q/total_k"
    - "每条序列 0 < seq_len_q <= seq_len_k"
    - "num_q_heads 是 num_kv_heads 的整数倍（相等即 MHA，否则 GQA）"
    - "1 <= head_dim <= 256"

tolerance:
  float16:  {atol: 2.0e-2, rtol: 2.0e-2}
  bfloat16: {atol: 2.0e-2, rtol: 2.0e-2}
  compare: "reference 以 float32 计算后 cast 到输出 dtype 再比较"
  note: >
    以上为本评测集的验收容差，用于离线终审。在线（搜索循环内）由
    KernelBenchPaperEvaluator 判定：triton 后端输入与模型统一 cast 为
    fp32、allclose(atol=rtol=1e-4)，与上表不同——在线结论不能替代终审。

# 终审静态审计沿用（在线仅靠 Model docstring 软约束）
forbidden:
  - scaled_dot_product_attention
  - sdpa
  - flash_attn
  - aiter
  - torch.matmul
  - torch.bmm
  - torch.einsum
  - torch.softmax
