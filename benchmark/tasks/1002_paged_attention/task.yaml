id: "1002_paged_attention"
name: paged_attention_decode
family: attention
impl_lang: triton
entry: model_class          # KernelBench 兼容形态：Model/ModelNew + get_inputs/get_init_inputs
difficulty: hard            # catalog level 映射：basic=1 / medium=2 / hard=3

description: >
  1001_paged_attention 的 model_class（KernelBench 兼容）变体，算子语义与
  1001 完全一致（单 token decode 的 paged attention，MHA/GQA，分页 KV Cache，
  在线 softmax，float32 中间累加）。差别只在任务入口形态：本题为自包含的
  KernelBench 题目文件（reference.py 即题目文件，同时镜像到
  benchmark/kernelbench_compat/level3/），可直接走 PyramidKernel 的原生
  model_class 路径（--kernelbench-root benchmark/kernelbench_compat
  --level 3 --problem-id 1002），无需任何框架改动。
  starter 由框架 loader 从 Model 自动生成 ModelNew scaffold（锚点：
  helpers / init_body / forward_stmt_N），本任务包不单独提供 starter。

io:
  inputs:
    - {name: query,      dtype: [float16, bfloat16], layout: contiguous, ndim: 3, shape: [num_seqs, num_q_heads, head_size]}
    - {name: key_cache,   dtype: same_as_query,      layout: contiguous, ndim: 4, shape: [num_blocks, num_kv_heads, block_size, head_size]}
    - {name: value_cache, dtype: same_as_query,      layout: contiguous, ndim: 4, shape: [num_blocks, num_kv_heads, block_size, head_size]}
    - {name: block_tables, dtype: int32,             layout: contiguous, ndim: 2, shape: [num_seqs, max_blocks_per_seq]}
    - {name: seq_lens,    dtype: int32,              layout: contiguous, ndim: 1, shape: [num_seqs]}
  outputs:
    - {name: out, dtype: same_as_query, layout: contiguous, ndim: 3, shape: [num_seqs, num_q_heads, head_size]}
  init_inputs:
    - {name: head_size, dtype: int64, layout: scalar}   # scale 缺省 1/sqrt(head_size)

shape:
  # get_inputs() 固定的 shape 族（在线评测单一实例；shape 全域约束沿用 1001）
  fixed_family: {num_seqs: 8, num_kv_heads: 8, query_group_size: 4, head_size: 64, block_size: 16, max_seq_len: 1024}
  dynamic: true
  invariants:
    - "num_q_heads == num_kv_heads * query_group_size"
    - "block_tables[s, ceil(seq_lens[s]/block_size)] 为该序列全部有效物理块"
    - "物理块池 num_blocks 可大于实际使用块数；未引用槽位内容不定"

tolerance:
  float16:  {atol: 2.0e-2, rtol: 2.0e-2}
  bfloat16: {atol: 2.0e-2, rtol: 2.0e-2}
  compare: "reference 以 float32 计算后 cast 到输出 dtype 再比较"
  note: >
    以上为本评测集的验收容差，用于离线终审。在线（搜索循环内）由
    KernelBenchPaperEvaluator 判定：triton 后端输入与模型统一 cast 为
    fp32、allclose(atol=rtol=1e-4)，与上表不同——在线结论不能替代终审。

# 终审静态审计沿用（在线仅靠 Model docstring 软约束）
forbidden:
  - scaled_dot_product_attention
  - sdpa
  - flash_attn
  - aiter
  - torch.matmul
  - torch.bmm
  - torch.einsum
  - torch.softmax

source:
  repo: OpenDAS/aiter
  commit: c39fff8c77df4e80617649e92fa3c2615f2c43d1
  path: aiter/ops/triton/pa_decode.py   # 仅维护者溯源用；与 1001 同源
