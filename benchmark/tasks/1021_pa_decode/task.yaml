id: "1021_pa_decode"
name: paged_attention_decode_longctx
family: attention
impl_lang: triton
entry: model_class          # KernelBench 兼容形态：Model/ModelNew + get_inputs/get_init_inputs
difficulty: hard            # catalog level 映射：basic=1 / medium=2 / hard=3

description: >
  长上下文（max(seq_lens) > 8192）分页 KV decode attention，KernelBench 兼容
  model_class 形态。与 1002_paged_attention 同源分流、变体子集互不重叠：
  1002 取 v1 单 pass 工况（max_seq_len <= 8192，单计算单元一趟扫完整个
  序列）；本题取 v2 分区两 pass 工况——KV 序列按 1024-token 分区并行，
  逐分区在线 softmax 得到 (m_p, l_p, o_p)，再跨分区 log-sum-exp 归并
  （主 kernel + reduce kernel 两 pass），数学上与整体在线 softmax 等价。
  MHA/GQA、fp16/bf16、非量化 KV、无 ALiBi、无滑窗。get_inputs 固定
  shape 族：num_seqs=4 / num_q_heads=32 / num_kv_heads=8 / head_size=128 /
  block_size=16 / max_seq_len=16384。难度 hard：分页寻址 + 长序列 + 跨分区
  归并的数值稳定性与掩蔽（尾分区/尾块/长度悬殊）共同构成实现门槛，
  starter 由框架 loader 从 Model 自动生成 ModelNew scaffold（锚点：
  helpers / init_body / forward_stmt_N），本任务包不单独提供 starter。

io:
  inputs:
    - {name: query,      dtype: [float16, bfloat16], layout: contiguous, ndim: 3, shape: [num_seqs, num_q_heads, head_size]}
    - {name: key_cache,   dtype: same_as_query,      layout: contiguous, ndim: 4, shape: [num_blocks, num_kv_heads, block_size, head_size]}
    - {name: value_cache, dtype: same_as_query,      layout: contiguous, ndim: 4, shape: [num_blocks, num_kv_heads, block_size, head_size]}
    - {name: block_tables, dtype: int32,             layout: contiguous, ndim: 2, shape: [num_seqs, max_blocks_per_seq]}
    - {name: seq_lens,    dtype: int32,              layout: contiguous, ndim: 1, shape: [num_seqs]}
  outputs:
    - {name: out, dtype: same_as_query, layout: contiguous, ndim: 3, shape: [num_seqs, num_q_heads, head_size]}
  init_inputs:
    - {name: head_size, dtype: int64, layout: scalar}   # scale 缺省 1/sqrt(head_size)

shape:
  # get_inputs() 固定的 shape 族（在线评测单一实例；shape 全域约束沿用 1001/1002）
  fixed_family: {num_seqs: 4, num_kv_heads: 8, query_group_size: 4, head_size: 128, block_size: 16, max_seq_len: 16384}
  dynamic: true
  invariants:
    - "num_q_heads == num_kv_heads * query_group_size"
    - "1 <= seq_lens[s] <= max_seq_len；hidden/perf case 均满足 max(seq_lens) > 8192（长上下文工况，分区调度触发条件）"
    - "block_tables[s, 0:ceil(seq_lens[s]/block_size)] 为该序列全部有效物理块"
    - "物理块池 num_blocks 可大于实际使用块数；未引用槽位内容不定"

tolerance:
  float16:  {atol: 2.0e-2, rtol: 2.0e-2}
  bfloat16: {atol: 2.0e-2, rtol: 2.0e-2}
  compare: "reference 以 float32 计算后 cast 到输出 dtype 再比较"
  note: >
    以上为本评测集的验收容差，用于离线终审。官方测试对非量化路径用
    atol=rtol=1e-2（Triton kernel vs fp16 参考）；本题 reference 中间累加
    为 float32，与 kernel 的偏差不大于官方对比的偏差，沿用评测集统一的
    2e-2/2e-2。在线（搜索循环内）由 KernelBenchPaperEvaluator 判定：
    triton 后端输入与模型统一 cast 为 fp32、allclose(atol=rtol=1e-4)，
    与上表不同——在线结论不能替代终审。

# 终审静态审计沿用（在线仅靠 Model docstring 软约束）
forbidden:
  - scaled_dot_product_attention
  - sdpa
  - flash_attn
  - aiter
  - torch.matmul
  - torch.bmm
  - torch.einsum
  - torch.softmax

