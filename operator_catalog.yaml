      path: "aiter/ops/triton/pa_decode.py"   # 与 1001 同源
    impl_lang: triton
    entry: model_class
    core_compute: "与 1001 相同（pa_decode.py v1 Triton decode 路径）；本体为 1001 的 KernelBench 兼容变体"
    external_calls: []
    status: admitted
    difficulty: hard
    note: "2026-10-01 准入。1001 的 model_class 变体：题目文件 benchmark/tasks/1002_paged_attention/reference.py（自包含 Model/get_inputs/get_init_inputs），镜像到 benchmark/kernelbench_compat/level3/，走 PyramidKernel 原生路径（--level 3 --problem-id 1002），零框架改动。语义与 1001 逐行一致（tests/test_1002_model_class.py 校验输出相等）。在线评测语义为 KernelBench 的（fp32 cast + allclose 1e-4 + 全局 RNG 输入），本评测集的容差/隐藏 case/forbidden 终审标准只在线下生效，终审复用 1001 的 private/ 资产"

