# operator_catalog.yaml — 全量算子登记与准入状态
#
# 字段说明：
#   id            : 任务 id，<四位序号>_<算子名>，目录同名
#   name / family : 算子名与家族（elementwise / reduce / norm / gemm / attention / moe / quant / ...）
#   source        : 来源仓库、commit、相对路径
#   impl_lang     : hip | triton（aiter 中同一算子可能两套实现，可分别登记两题）
#   entry         : callable（缺省，函数式 starter）| model_class（KernelBench 兼容形态）
#   core_compute  : 核心计算实际所在的文件与语言，准入审核的关键证据
#   external_calls: 实现中调用的外部库（rocblas / miopen / ck / ...），含闭源库调用的不得准入
#   status        : candidate | admitted | rejected
#   difficulty    : basic | medium | hard（准入后评定）
#   note          : 审核备注

operators:
  # ---- 示例：已准入 ----
  - id: "0001_vecadd"
    name: vecadd
    family: elementwise
    source:
      repo: OpenDAS/aiter
      commit: ""              # TODO: 记录实际快照 commit
      path: ""                # 示例任务，非来自 aiter
    impl_lang: hip
    core_compute: "starter 内置演示题，无外部来源"
    external_calls: []
    status: admitted
    difficulty: basic
    note: "闭环验证用示例题：打通 hipcc 编译 → 正确性 → 性能计时"

  # ---- 示例：候选（aiter 强项，attention/moe 子集的预期成员） ----
  - id: "1001_paged_attention"
    name: paged_attention_decode
    family: attention
    source:
      repo: OpenDAS/aiter
      commit: c39fff8c77df4e80617649e92fa3c2615f2c43d1
      path: "aiter/ops/triton/pa_decode.py"
    impl_lang: triton
    core_compute: "pa_decode.py: _paged_attn_decode_v1_wo_dot_kernel / _paged_attn_decode_v1_w_dot_kernel（在线 softmax + tl.dot，纯 Triton，无外部库）"
    external_calls: []
    status: admitted
    difficulty: hard
    note: "2026-09-25 首次准入。取 Triton decode 路径（v1，max_seq_len<=8192，fp16/bf16 非量化，无 ALiBi/滑窗）；module_pa（vLLM v1/v2 HIP）不在 JIT 构建配置、依赖预编译 aiter_，已排除；chunked prefill 与 v2 flash-decoding 留作后续独立候选。审核记录见 benchmark/sources/1001_paged_attention.yaml"

  - id: "1002_paged_attention"
    name: paged_attention_decode
