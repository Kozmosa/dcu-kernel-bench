# environment.yaml — 评测环境锁定
# 官方基线与 Agent 生成实现必须在本文件锁定的同一环境内比较。
# 2026-11-21：旧机（BW）不可用，评测目标**迁移到当前机器**（K500SM_AI / gfx928）。
# 迁移范围：题面硬件句、kernelbench 镜像、工具模板、DCU Wiki 语料与消融配置。
# 未完成：基线重采、aiter 安装、LLM 出口（见 docs/machine-2026-11-21-k500sm-gfx928.md）。

hardware:
  # 题目包（task docstring / kernelbench 镜像）声明的目标架构 —— 迁移后统一为 gfx928。
  benchmark_target_arch:
    - gfx928

  # 历史目标（gfx936 时代的题面与全部旧基线都出自这台）：保留记录，不再作为目标。
  historical_target_arch:
    - gfx936
    - gfx938

  # 当前机器（021 组 / 昆山），2026-11-21 实测。
  measured_machine:
    device_name: "K500SM_AI"
    vendor: "C-3000"
    gcn_arch: "gfx928:sramecc+:xnack-"
    device_id: "0x6210"                  # rocm-smi DID
    pci_bus: "0000:4:00.0"
    vbios: "5.715.001000p.618009"
    compute_units: 120
    simds_per_cu: 4
    wavefront_size: 64
    workgroup_max: 1024
    max_waves_per_cu: 40
    work_items_per_cu: 2560
    vram_mib: 65520
    l2_kib: 8192
    clock_mhz: 1400
    power_cap_w: 300
    shared_mem_per_block_bytes: 65536    # 96 KiB 静态 shared 编译期被拒
    copy_GBps: 687.8                     # 自测 float4 拷贝 512 MiB×10，仅作量级参考
    visible_hcu: 1
    host: "crdnotebook-2123985930296999938-scne28t3r4-69492"
    host_cpu: "Hygon C86 7185 32-core（nproc 可见 32）"
    host_ram_gib: 503                    # 无 cgroup 内存上限
    disk: "overlay 1.8T，可用 524G"

software:
  dtk: "26.04"                           # /opt/dtk -> /opt/dtk-26.04，source /opt/dtk/env.sh
  hipcc: "dcc 25.10.0-0 (clang 17.0.0)"
  python: "3.11.9"
  torch: "2.9.0+das.opt1.dtk2604"        # HIP 6.3.26093，wheel tag cp311
  triton: "3.3.0+das.opt1.dtk2604.torch290"
  # triton wheel：dtk2604/torch290/cp311，取自 download.sourcefind.cn /4/triton/DAS1.8/
  # 装机后已验证：vecadd ✓、tl.dot fp16 ✓（max err 1.6e-2）、triton.language.extra.libdevice ✓
  aiter: ""                              # 未安装；采 aiter 基线前必须装（或装最小导入垫片）
  os: "Ubuntu 22.04.5 LTS 容器，宿主内核 3.10.0-957.el7"

build:
  compiler: hipcc
  cxxstd: c++17
  default_flags:
    - "-O3"
    - "--offload-arch=gfx928"            # 显式指定时必须与实测架构一致，否则产物跑不起来

timing:
  warmup_iters: 10
  repeat_iters: 50
  reduction: median

notes:
  - "旧机（现有基线来源）：BW / gfx936:sramecc+:xnack- / 80 CU / 68.7 GB / DTK 26.04 / triton 3.3.0——已不可用。"
  - "benchmark/private/*/baseline.json 全部来自旧机（environment.gcn_arch=gfx936），在 gfx928 上**未重采前不可使用**。"
  - "本机无外网（pypi / download.sourcefind.cn / 公网 443 均不可达）：triton 与 aiter 只能由本地上传；LLM 出口需反向隧道。"
